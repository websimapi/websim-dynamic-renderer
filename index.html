<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynamic Renderer</title>
<style>
body{margin:0;font-family:monospace;background:#000;color:#0f0}
#log{position:fixed;top:0;left:0;width:100%;height:100px;background:#111;border-bottom:1px solid #333;overflow-y:auto;padding:10px;box-sizing:border-box;z-index:9999;font-size:12px}
#content{margin-top:100px;padding:20px}
.step{margin:5px 0;opacity:0.7}
.step.active{opacity:1;color:#ff0}
.error{color:#f00}
.success{color:#0f0}
</style>
</head>
<body>
<div id="log"></div>
<div id="content"></div>
<script>
(async()=>{
const log=document.getElementById('log');
const content=document.getElementById('content');
const l=(msg,type='info')=>{
const div=document.createElement('div');
div.className=`step ${type}`;
div.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
log.appendChild(div);
log.scrollTop=log.scrollHeight;
};

const q=Object.fromEntries(new URLSearchParams(location.search));
if(!Object.keys(q).length){
content.innerHTML='<h1>Dynamic Renderer Ready</h1><p>Add query parameters to render content dynamically.</p>';
return;
}

l('Starting dynamic renderer...');
l(`Query: ${JSON.stringify(q)}`);

try{
const prompt=`You are a dynamic web content renderer. Analyze the query parameters and create appropriate HTML/CSS/JavaScript content.

Query Parameters: ${JSON.stringify(q,null,2)}

Available WebSim Functions:
- websim.chat.completions.create({messages,json}) - AI chat
- websim.imageGen({prompt,aspect_ratio}) - Generate images  
- websim.textToSpeech({text,voice}) - Text to speech
- websim.getUser() - Get user data

Instructions:
1. Interpret the query parameters to understand what content to render
2. Create appropriate HTML, CSS, and JavaScript
3. If complex, break into multiple steps
4. Handle errors gracefully
5. Return JSON with: {html:"...",css:"...",js:"...",steps:["step1","step2"]}

Create engaging, interactive content based on the query parameters.`;

l('Asking LLM to interpret query...');
const r=await websim.chat.completions.create({
messages:[{role:"system",content:prompt}],
json:true
});

const d=JSON.parse(r.content);
l('LLM response received','success');

if(d.steps){
for(let i=0;i<d.steps.length;i++){
l(`Step ${i+1}: ${d.steps[i]}`,'active');
await new Promise(resolve=>setTimeout(resolve,500));
}
}

if(d.html){
l('Rendering HTML...');
const htmlEl=document.createElement('div');
htmlEl.innerHTML=d.html;
content.appendChild(htmlEl);
}

if(d.css){
l('Applying CSS...');
const style=document.createElement('style');
style.textContent=d.css;
document.head.appendChild(style);
}

if(d.js){
l('Executing JavaScript...','active');
try{
const func=new Function('websim','content','log',d.js);
await func(websim,content,l);
l('JavaScript executed successfully','success');
}catch(jsErr){
l(`JS Error: ${jsErr.message}`,'error');
}
}

l('Rendering complete!','success');

}catch(e){
l(`Error: ${e.message}`,'error');
content.innerHTML=`<h1>Error</h1><pre>${e.message}</pre><p>Query: ${JSON.stringify(q,null,2)}</p>`;
}
})();
</script>

</body>
</html>
